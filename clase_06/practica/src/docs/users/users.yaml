paths:
  /api/users/:
    get:
      summary: Get all users
      description: Retrieve a list of all users.
      tags:
        - Users
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Internal server error.

  /api/users/{uid}:
    get:
      summary: Get a user by ID
      description: Retrieve a user by their unique ID.
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
      responses:
        '200':
          description: A single user object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
        '500':
          description: Internal server error.
    put:
      summary: Update a user by ID
      description: Update the details of a user by their unique ID.
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
        '500':
          description: Internal server error.
    delete:
      summary: Delete a user by ID
      description: Delete a user by their unique ID.
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully.
        '404':
          description: User not found.
        '500':
          description: Internal server error.

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: ObjectId
          description: The unique identifier for the user.
        first_name:
          type: string
          description: The first name of the user.
        last_name:
          type: string
          description: The last name of the user.
        email:
          type: string
          description: The email address of the user.
        password:
          type: string
          description: The password of the user.
        role:
          type: string
          description: The role of the user (e.g., admin, user).
        pets:
          type: array
          items:
            type: string
          description: An array of pet IDs associated with the user.
      required:
        - _id
        - first_name
        - last_name
        - email
        - password
      